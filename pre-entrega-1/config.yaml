# All tunable defaults and validation boundaries for the LLM client.
# Nothing in src/ hardcodes these values: they are loaded and validated at
# startup by src/settings.py (AppSettings). Secrets do NOT belong here —
# API keys go in .env (see .env.example).

defaults:
  temperature: 0.7
  max_tokens: 1024
  timeout_s: 30.0        # per-call deadline, also passed to the SDK clients
  max_attempts: 3        # total attempts per provider (1 initial + retries)
  base_delay_s: 1.0      # first backoff delay; doubles on each retry
  jitter_min: 0.5        # each delay is scaled by uniform(jitter_min, jitter_max)
  jitter_max: 1.5
  max_concurrent: 5      # semaphore size: max in-flight requests per manager

limits:
  temperature_min: 0.0
  temperature_max: 2.0
  max_tokens_limit: 8192

# Model IDs are config, not code: catalogs move faster than course material.
models:
  openai: gpt-4o-mini
  anthropic: claude-haiku-4-5
  gemini: gemini-flash-lite-latest  # non-thinking: streams text immediately;
                                    # gemini-flash-latest now always "thinks"
                                    # and can spend max_tokens on thoughts

# Order in which providers are tried by the demos (first = primary).
fallback_order:
  - anthropic
  - openai
  - gemini
