# All tunable defaults for the local RAG system.
# Nothing in src/ hardcodes these values: they are loaded and validated at startup by
# src/local_rag/config.py (AppSettings). Secrets do NOT belong here — the API key goes
# in .env (see .env.example).

# Paths are relative to the project root (this folder) unless absolute.
data_directory: data
persist_directory: vectorstore
collection_name: techcorp_policies

# The ONE place the embedding model is named. The same model indexes and queries
# (course "error #1": never mix embedding models). Local and keyless.
# multilingual-e5-small: multilingual (Spanish included), 384 dims, 512-token limit.
# e5 models were trained with these prefixes; both are applied inside build_embeddings().
embedding_model_name: intfloat/multilingual-e5-small
embedding_document_prefix: "passage: "
embedding_query_prefix: "query: "

# Chunking, measured in tokens (course rule), not characters.
tiktoken_encoding: cl100k_base
chunk_size_tokens: 500
chunk_overlap_tokens: 50

# Fragments passed to the LLM per question. The brief requires 3–5 ("infinite context" error).
top_k: 4

llm:
  # Model IDs are config, not code: catalogs move faster than course material.
  # gemini-3.5-flash verified 2026-09-14 (see README). Fallback alias: gemini-flash-latest.
  model_name: gemini-flash-lite-latest
  temperature: 0.0        # grounded QA wants determinism, not creativity
  timeout_s: 30.0         # per model call
  max_attempts: 3         # total attempts per call (1 initial + 2 retries)
  backoff:                # wait before retry n: min(initial * 2**n + uniform(0, jitter), max) seconds
    initial: 1.0
    max: 10.0
    jitter: 1.0

# User-facing (Spanish): the exact sentence the model must return when the answer is not
# in the retrieved context. The trap test compares against it.
refusal_sentence: "No tengo acceso a esa información en los documentos disponibles."
